# ==============================================================================
# SEMARAK ALIYAH XIV 2026 - CUSTOM POSTGRESQL 18 HIGH-PERFORMANCE TUNING
# ==============================================================================
# File ini dirancang khusus untuk database PostgreSQL 18.6 pada aplikasi SEMARAK
# Mengoptimalkan konkurensi pendaftaran peserta massal, reporting, dan scoring real-time.
# ==============================================================================

# --- NETWORK & CONNECTIONS ---
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 3

# --- MEMORY TUNING (Berdasarkan profil 2GB-4GB RAM container) ---
shared_buffers = 512MB                  # 25% dari alokasi RAM container
effective_cache_size = 1536MB           # 75% estimasi cache sistem operasi
work_mem = 16MB                         # Alokasi memori per sort/hash operation
maintenance_work_mem = 128MB            # Alokasi memori untuk VACUUM, CREATE INDEX, ALTER TABLE
temp_buffers = 16MB                     # Memori untuk temporary table per sesi
dynamic_shared_memory_type = posix

# --- STORAGE & DISK OPTIMIZATION (Optimasi SSD / NVMe Storage) ---
random_page_cost = 1.1                  # 1.1 sangat optimal untuk SSD (default HDD 4.0 membuat query lambat)
seq_page_cost = 1.0                     # Biaya pemindaian sekuensial
effective_io_concurrency = 200          # Jumlah operasi I/O paralel yang dapat ditangani SSD

# --- CHECKPOINTS & WRITE-AHEAD LOG (WAL) ---
checkpoint_completion_target = 0.9      # Menyebarkan checkpoint load ke 90% durasi checkpoint
checkpoint_timeout = 15min              # Interval checkpoint berkala
min_wal_size = 1GB                      # Ukuran minimum WAL yang dipertahankan
max_wal_size = 4GB                      # Ukuran batas WAL sebelum checkpoint paksa
wal_buffers = 16MB                      # Buffer WAL dalam memori sebelum flush ke disk
wal_writer_delay = 200ms

# --- PARALLEL QUERY EXECUTION ---
max_worker_processes = 4                # Jumlah background worker process
max_parallel_workers_per_gather = 2     # Worker per single query execution
max_parallel_workers = 4                # Total worker aktif untuk parallel query
max_parallel_maintenance_workers = 2    # Parallel worker untuk VACUUM & CREATE INDEX

# --- AUTOVACUUM TUNING (Mencegah Table Bloat Saat Pendaftaran Massal) ---
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.05   # Trigger vacuum saat 5% baris diperbarui/dihapus
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.02  # Trigger analyze saat 2% baris berubah
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 500

# --- QUERY PLANNER OPTIMIZATION ---
default_statistics_target = 100         # Akurasi statistik query planner

# --- LOGGING & SLOW QUERY MONITORING ---
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_duration_statement = 250        # Catat query yang memakan waktu > 250 milidetik (Slow Query)
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Asia/Jakarta'
timezone = 'Asia/Jakarta'
